name: Build SuperTux iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ==========================================
      # 2. Select Xcode
      # ==========================================
      - name: Select Xcode
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode_16.4.app

          echo "Xcode:"
          xcodebuild -version

      # ==========================================
      # 3. Find Xcode project
      # ==========================================
      - name: Find Xcode project
        id: project
        run: |
          set -e

          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Xcode projects:"
          find "$GITHUB_WORKSPACE" \
            -name "*.xcodeproj" \
            -print

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -name "SuperTux-iOS.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: SuperTux-iOS.xcodeproj not found."
            exit 1
          fi

          echo ""
          echo "Selected project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # 4. Show schemes
      # ==========================================
      - name: Show schemes
        run: |
          set -e

          PROJECT="${{ steps.project.outputs.project }}"

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Available schemes:"
          echo "------------------------------------------"

          xcodebuild \
            -project "$PROJECT" \
            -list

      # ==========================================
      # 5. Build
      # ==========================================
      - name: Build SuperTux
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          PROJECT="${{ steps.project.outputs.project }}"

          LOG="$RUNNER_TEMP/supertux-build.log"

          echo "=========================================="
          echo "Building SuperTux iOS"
          echo "=========================================="

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Log:"
          echo "$LOG"

          echo ""

          xcodebuild \
            -project "$PROJECT" \
            -scheme "SuperTux iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOG"

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "xcodebuild exit code: $EXIT_CODE"
          echo "=========================================="

          exit "$EXIT_CODE"

      # ==========================================
      # 6. Print actual errors
      # ==========================================
      - name: Show actual build errors
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "ACTUAL XCODE ERRORS"
          echo "=========================================="

          LOG="$RUNNER_TEMP/supertux-build.log"

          if [ ! -f "$LOG" ]; then
            echo "Build log not found."
            exit 0
          fi

          echo ""
          echo "---- ERROR LINES ----"

          grep -nEi \
            "error:|fatal error:|BUILD FAILED|ARCHIVE FAILED" \
            "$LOG" \
            | tail -200 || true

          echo ""
          echo "---- LAST 300 LINES ----"

          tail -300 "$LOG" || true

      # ==========================================
      # 7. Upload build log
      # ==========================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SuperTux-build-log
          path: ${{ runner.temp }}/supertux-build.log
          if-no-files-found: warn

      # ==========================================
      # 8. Find .app
      # ==========================================
      - name: Find built app
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for .app"
          echo "=========================================="

          find "$RUNNER_TEMP/DerivedData" \
            -type d \
            -name "*.app" \
            -print

      # ==========================================
      # 9. Create IPA
      # ==========================================
      - name: Create IPA
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Creating IPA"
          echo "=========================================="

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" \
            -type d \
            -name "supertux2.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then

            echo "supertux2.app not found."
            echo "Searching for any .app..."

            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" \
              -type d \
              -name "*.app" \
              -print -quit)

          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          echo ""
          echo "Using app:"
          echo "$APP_PATH"

          # --------------------------------------
          # Create Payload
          # --------------------------------------

          rm -rf "$RUNNER_TEMP/Payload"

          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$APP_PATH" \
            "$RUNNER_TEMP/Payload/"

          # --------------------------------------
          # Create IPA
          # --------------------------------------

          cd "$RUNNER_TEMP"

          rm -f SuperTux-iOS-unsigned.ipa

          zip -qry \
            SuperTux-iOS-unsigned.ipa \
            Payload

          echo ""
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh \
            "$RUNNER_TEMP/SuperTux-iOS-unsigned.ipa"

      # ==========================================
      # 10. Upload IPA
      # ==========================================
      - name: Upload IPA
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SuperTux-iOS-unsigned
          path: ${{ runner.temp }}/SuperTux-iOS-unsigned.ipa
          if-no-files-found: error

      # ==========================================
      # 11. Fail workflow if build failed
      # ==========================================
      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "SuperTux build failed."
          echo "=========================================="
          echo ""
          echo "Check the ACTUAL XCODE ERRORS section."
          echo "A complete build log was also uploaded."
          exit 1