name: Build SuperTux iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive
        run: |
          xcodebuild archive \
            -project SuperTux-iOS.xcodeproj \
            -scheme "SuperTux iOS" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/SuperTux.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R \
            "$RUNNER_TEMP/SuperTux.xcarchive/Products/Applications/SuperTux iOS.app" \
            "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          zip -r SuperTux-iOS-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperTux-iOS-unsigned
          path: ${{ runner.temp }}/SuperTux-iOS-unsigned.ipa