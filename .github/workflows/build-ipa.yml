name: Build SuperTux iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode_16.4.app

          echo "Xcode:"
          xcodebuild -version

      - name: Find Xcode project
        id: find_project
        run: |
          set -e

          echo "Current directory:"
          pwd

          echo ""
          echo "Searching for Xcode projects..."

          find . -name "*.xcodeproj" -print

          PROJECT=$(find . \
            -name "SuperTux-iOS.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find . \
              -name "*.xcodeproj" \
              -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found."
            exit 1
          fi

          echo ""
          echo "Selected project:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show schemes
        run: |
          set -e

          PROJECT="${{ steps.find_project.outputs.project }}"

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Available schemes:"

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Build SuperTux
        run: |
          set -e

          PROJECT="${{ steps.find_project.outputs.project }}"

          echo "Building:"
          echo "$PROJECT"

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "SuperTux iOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Find built app
        run: |
          set -e

          echo "Searching for applications..."

          find "$RUNNER_TEMP/DerivedData" \
            -type d \
            -name "*.app" \
            -print

      - name: Create IPA
        run: |
          set -e

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" \
            -type d \
            -name "supertux2.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" \
              -type d \
              -name "*.app" \
              -print -quit)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            exit 1
          fi

          echo "Using app:"
          echo "$APP_PATH"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"

          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"

          rm -f SuperTux-iOS-unsigned.ipa

          zip -r \
            SuperTux-iOS-unsigned.ipa \
            Payload

          echo ""
          echo "IPA:"
          ls -lh SuperTux-iOS-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperTux-iOS-unsigned
          path: ${{ runner.temp }}/SuperTux-iOS-unsigned.ipa
          if-no-files-found: error